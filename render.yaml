services:
  - type: web
    name: groq-proxy
    runtime: go
    plan: free
    region: oregon
    buildCommand: go build -o proxy -mod=mod ./...
    startCommand: ./proxy
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PROXY_SECRET
        sync: false
      - key: RATE_LIMIT_MAX
        value: "20"